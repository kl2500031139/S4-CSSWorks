<!DOCTYPE html>
<html>
    <head>
        <title>
            ID CARD
        </title>
        <style>
            .id-card{
                width: 350px;
                height: 220px;
                border: 2px solid #333;
                border-radius: 15px;
                background-color: #f5f5f5;
                font-family: Arial, Helvetica, sans-serif;
                box-shadow: 0 4px rgb(155, 7, 7);
            }
            .collage-name{
                text-align: center;
            }
            .student-photo{
                width: 90px;
                height: 100px;
                border: 1px solid #333;
                float: left;
                margin-left: 10px;
                margin-right:15px ;
                object-fit: cover;
                border-radius: 10px;

            }
            .details{
                color: darkblue;
            }
            .group{
                text-align: center;
                margin-top: 10px;
                font-weight: bold;
                color: darkblue;
            }

            

        </style>
    </head>
    <body>
        <div class="id-card">
            <div class="collage-name">
                kl university
            </div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQufYkgZ249ponwskdUHcTUQm4xT28VlJePB7CPp5TERA&s=10" alt="photo" class="student-photo">
            <div class="details">
                <b>name</b>:ojesvi<br>
                <b>Roll Number</b>: 2500031139<br>
                <b>course</b>: B.Tech<br>
                <b>Year</b>: II year<br>
                <b>validity</b>: 2029
                <div class="group">
                    <b>Blood Group</b>: A+
                </div>
            </div>
        </div>
    </body>
</html>
